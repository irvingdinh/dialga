services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "48310:48310"
    environment:
      HOST: 0.0.0.0
      PORT: "48310"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: dialga
      DB_NAME: dialga
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: dialga-dev-secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: dialga
      MYSQL_DATABASE: dialga
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
